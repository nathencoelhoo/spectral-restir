name: CI
on: [push, pull_request]

jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Spectral math tests
        run: g++ -std=c++20 -O2 tests/spectral_test.cpp -o spectral_test && ./spectral_test
      - name: Transport (glass furnace) tests
        run: g++ -std=c++20 -O2 tests/transport_test.cpp -o transport_test && ./transport_test
      - name: NEE / MIS tests
        run: g++ -std=c++20 -O2 tests/nee_test.cpp -o nee_test && ./nee_test
      - name: ReSTIR toy model (reuse unbiasedness)
        run: g++ -std=c++20 -O2 tests/restir_toy_test.cpp -o restir_toy_test && ./restir_toy_test 100000
      - name: ReSTIR toy model on the prism geometry
        run: ./restir_toy_test 100000 1.5 0.03 prism

  gpu-lavapipe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libvulkan-dev vulkan-tools mesa-vulkan-drivers glslc
      - name: Build (compiles C++ and GLSL)
        run: |
          cmake -B build
          cmake --build build
      - name: Furnace test (must print PASS)
        run: ./build/sr_render 0 64 64 64 build/pathtrace.spv furnace.ppm
      - name: Render prism scene (800x600, 1024 spp)
        run: ./build/sr_render 1 800 600 1024 build/pathtrace.spv prism.ppm
      - name: Reference render (NEE+MIS, 8192 spp)
        run: ./build/sr_render 1 256 192 8192 build/pathtrace.spv ref.ppm ref.pfm 100000
      - name: Bias check (NEE+MIS vs brute-force path tracing)
        run: |
          ./build/sr_render 2 256 192 8192 build/pathtrace.spv bruteforce.ppm bruteforce.pfm 200000
          ./build/sr_compare ref.pfm bruteforce.pfm 0.02
      - name: Second reference (independent seeds, for noise calibration)
        run: ./build/sr_render 1 256 192 8192 build/pathtrace.spv ref2.ppm ref2.pfm 300000
      - name: Per-region bias check (prism / near floor / far floor)
        run: python3 scripts/region_bias.py ref.pfm ref2.pfm bruteforce.pfm
      - name: ReSTIR part 1 (mode 3, candidates only) vs reference
        run: |
          ./build/sr_render 3 256 192 8192 build/pathtrace.spv restir.ppm restir.pfm 400000 4
          ./build/sr_compare ref.pfm restir.pfm 0.02
          python3 scripts/region_bias.py ref.pfm ref2.pfm restir.pfm
      - name: Negative control (caustic channel disabled must be detected)
        run: |
          ./build/sr_render 3 256 192 2048 build/pathtrace.spv neg.ppm neg.pfm 500000 0
          if python3 scripts/region_bias.py ref.pfm ref2.pfm neg.pfm; then
            echo "Negative control NOT detected: the bias check is too weak"; exit 1
          else
            echo "Negative control detected as expected"
          fi
      - name: Caustic-channel references (mode 4, 8 candidates, no reuse)
        run: |
          ./build/sr_render 4 160 120 1024 build/pathtrace.spv c_ref.ppm c_ref.pfm 700000 8 0
          ./build/sr_render 4 160 120 1024 build/pathtrace.spv c_ref2.ppm c_ref2.pfm 800000 8 0
      - name: ReSTIR part 2a, temporal reuse (bias test on the caustic channel)
        run: |
          ./build/sr_render 4 160 120 1024 build/pathtrace.spv c_temporal.ppm c_temporal.pfm 900000 6 1
          REGION_TILE=16 python3 scripts/region_bias.py c_ref.pfm c_ref2.pfm c_temporal.pfm "temporal reuse"
      - name: ReSTIR part 2b, temporal + spatial reuse (bias test on the caustic channel)
        if: always()
        run: |
          ./build/sr_render 4 160 120 1024 build/pathtrace.spv c_spatial.ppm c_spatial.pfm 1000000 2 3
          REGION_TILE=16 python3 scripts/region_bias.py c_ref.pfm c_ref2.pfm c_spatial.pfm "temporal+spatial reuse"
      - name: Reuse efficiency at equal path evaluations
        if: always()
        run: python3 scripts/restir_efficiency.py
      - name: Convergence sweep (RMSE should fall like 1/sqrt(N))
        run: python3 scripts/convergence.py
      - name: Convert images to PNG
        if: always()
        run: |
          python3 - <<'PY'
          import os, struct, zlib
          def ppm_to_png(src, dst):
              data = open(src, 'rb').read()
              parts, pos = [], 0
              while len(parts) < 4:                       # magic, width, height, maxval
                  while data[pos:pos+1].isspace(): pos += 1
                  start = pos
                  while not data[pos:pos+1].isspace(): pos += 1
                  parts.append(data[start:pos])
              pos += 1
              w, h = int(parts[1]), int(parts[2])
              raw = b''.join(b'\x00' + data[pos + y*w*3: pos + (y+1)*w*3] for y in range(h))
              def chunk(t, d):
                  c = struct.pack('>I', len(d)) + t + d
                  return c + struct.pack('>I', zlib.crc32(t + d) & 0xffffffff)
              png = b'\x89PNG\r\n\x1a\n' + chunk(b'IHDR', struct.pack('>IIBBBBB', w, h, 8, 2, 0, 0, 0)) \
                    + chunk(b'IDAT', zlib.compress(raw, 9)) + chunk(b'IEND', b'')
              open(dst, 'wb').write(png)
          for n in ('furnace', 'prism', 'ref', 'bruteforce', 'restir'):
              if os.path.exists(n + '.ppm'):
                  ppm_to_png(n + '.ppm', n + '.png')
          PY
      - name: Upload images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: renders
          path: |
            furnace.png
            prism.png
            ref.png
            bruteforce.png
            restir.png
          if-no-files-found: ignore
